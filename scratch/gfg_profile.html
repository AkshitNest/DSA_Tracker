rstanding of APIs \u0026amp; databases\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eProblem-solving mindset\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"1a:T14f7,"])</script><script>self.__next_f.push([1,"\u003cp class=\"break-words white-space-pre-wrap t-black--light text-body-medium\" style=\"box-sizing: inherit; margin: 0px; padding: 0px; border-color: rgba(0, 0, 0, 0.6); border-style: none; border-width: 0px; border-image: none 100% / 1 / 0 stretch; font-size: 16px; vertical-align: baseline; background-image: none; background-position: 0% 0%; background-size: auto; background-repeat: repeat; background-attachment: scroll; background-origin: padding-box; background-clip: border-box; line-height: 1.25; color: rgba(0, 0, 0, 0.6); font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Fira Sans', Ubuntu, Oxygen, 'Oxygen Sans', Cantarell, 'Droid Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Lucida Grande', Helvetica, Arial, sans-serif; white-space-collapse: preserve !important; overflow-wrap: break-word !important; word-break: break-word !important;\" data-mce-style=\"box-sizing: inherit; margin: 0px; padding: 0px; border-color: rgba(0, 0, 0, 0.6); border-style: none; border-width: 0px; border-image: none 100% / 1 / 0 stretch; font-size: 16px; vertical-align: baseline; background-image: none; background-position: 0% 0%; background-size: auto; background-repeat: repeat; background-attachment: scroll; background-origin: padding-box; background-clip: border-box; line-height: 1.25; color: rgba(0, 0, 0, 0.6); font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Fira Sans', Ubuntu, Oxygen, 'Oxygen Sans', Cantarell, 'Droid Sans', 'Apple Color E n style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eKey Responsibilities\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eWork closely with senior programmers and client\u003c/li\u003e\u003cli\u003eAssist in managing personal workflow under guidance\u003c/li\u003e\u003cli\u003eSupport in identifying issues and suggesting basic solutions\u003c/li\u003e\u003cli\u003eWork effectively in a fast-paced environment\u003c/li\u003e\u003cli\u003ePerform all tasks remotely via computer with no physical machine handling required\u003c/li\u003e\u003cli\u003eCreate and modify basic CAD drawings for granite countertops based on client inputs and architectural plans\u003c/li\u003e\u003cli\u003eAssist in using SlabSmith and AlphaCAM software for CNC programming, training will be provided\u003c/li\u003e\u003cli\u003eHelp in layout planning of slab pieces to optimize material usage\u003c/li\u003e\u003cli\u003eCollaborate with team members to ensure accuracy of designs\u003c/li\u003e\u003cli\u003eHandle multiple small tasks or projects with supervision\u003c/li\u003e\u003cli\u003eReview drawings and programmes with seniors before final approval\u003c/li\u003e\u003cli\u003eMaintain records of design changes and updates\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eRequired Skills\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eStrong English communication skills including reading, writing, listening and speaking\u003c/li\u003e\u003cli\u003eAutoCAD experience is mandatory\u003c/li\u003e\u003cli\u003eBasic understanding of CAD or CAM concepts\u003c/li\u003e\u003cli\u003eFamiliarity with AlphaCAM, MasterCAM or similar software is preferred but not mandatory\u003c/li\u003e\u003cli\u003eAbility to read and understand basic drawings or blueprints\u003c/li\u003e\u003cli\u003eBasic knowledge of Microsoft Office tools\u003c/li\u003e\u003cli\u003eWillingness to learn and adapt quickly\u003c/li\u003e\u003cli\u003eGood attention to detail\u003c/li\u003e\u003cli\u003eUnderstanding of accuracy and precision in work\u003c/li\u003e\u003cli\u003eAbility to meet deadlines with guidance\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003ePreferred Attributes\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHigh School Diploma required or Bachelor's Degree preferred in Mechanical, Civil or related field\u003c/li\u003e\u003cli\u003eBasic knowledge of blueprint reading is an advantage\u003c/li\u003e\u003cli\u003eInternship or training in CAD or CNC will be a plus\u003c/li\u003e\u003cli\u003eFreshers with strong AutoCAD skills are encouraged to apply\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eAdditional Requirements\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThis is a full-time, permanent and remote position\u003c/li\u003e\u003cli\u003eCandidates must have reliable power backup\u003c/li\u003e\u003cli\u003eMust have a well-maintained laptop and an additional desktop screen\u003c/li\u003e\u003cli\u003eFiber internet connection with 80 to 100 Mbps speed\u003c/li\u003e\u003cli\u003eHeadset with noise cancellation and microphone\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eInterview Details\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eInterview mode is virtual\u003c/li\u003e\u003cli\u003eInfrastructure requirement includes a laptop with i5 or i7 processor, 16 GB RAM, 100 Mbps internet and noise-cancelling headphones\u003c/li\u003e\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"1c:T472,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"color: rgb(0, 0, 0); font-family: verdana, geneva, sans-serif; font-size: 12pt; white-space-collapse: preserve; background-color: rgb(255, 255, 255);\" data-mce-style=\"color: #000000; font-family: verdana, geneva, sans-serif; font-size: 12pt; white-space-collapse: preserve; background-color: #ffffff;\"\u003e\u003cstrong\u003eChoreograph India\u003c/strong\u003e: The Architects of Intelligent Marketing At WPP, we are the world's largest advertising and marketing services company. At the forefront of data-driven innovation within WPP is Choreograph, a global data products and technology company. We empower the world's leading brands by translating complex data into powerful insights and actionable strategies, driving smarter business and marketing outcomes. Choreograph India is a dynamic hub of innovation, where we are actively engaged in cutting-edge projects in Machine Learning, Advanced Analytics, and Artificial Intelligence. We are not just analyzing data; we are building the future of marketing intelligence, solving intricate business challenges, and redefining how brands connect with consumers across diverse markets.\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1d:T2de9,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eAbout the Role: What Does This Role Require?\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eAs a Data Science \u0026amp; Analytics Specialist, you will be an integral part of our India team, contributing directly to projects that shape marketing strategies for global and local clients. This position is designed for an ambitious and analytical individual eager to launch their career in data science within the exciting realm of media and advertising. This role requires a keen eye for detail, a passion for problem-solving, and a foundational understanding of data science principles. You will be instrumental in turning raw data into meaningful stories, supporting the development of advanced analytical solutions, and ensuring our insights are robust and impactful.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eKey Responsibilities:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eAdvanced Analytics \u0026amp; Causal Inference:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eDesign, execute, and interpret complex statistical analyses (e.g., multivariate regression, time series decomposition, propensity score matching, difference-in-differences) to measure the causal impact of media investments and identify key performance drivers.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eDevelop and validate econometric models (e.g., Marketing Mix Models) to quantify cross-channel media effectiveness and optimize budget allocation.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eData Modelling \u0026amp; Feature Engineering:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eCollaborate with Data Scientists to define, refine, and engineer features from raw data for machine learning models, ensuring statistical rigor and business relevance.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eConduct in-depth data profiling and validation, working with Data Engineering teams to ensure data fitness for advanced analytical and modeling purposes.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eMethodology \u0026amp; Tooling Development:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eResearch, evaluate, and implement cutting-edge analytical methodologies and statistical frameworks to enhance existing approaches and address new business challenges.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eDevelop and maintain reusable analytical codebases (primarily in Python or R) adhering to software engineering best practices, including version control (Git) and modular design.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eTechnical Communication \u0026amp; Strategic Storytelling:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eTranslate complex analytical findings, model outputs, and statistical inferences into clear, actionable recommendations for both technical and executive-level audiences.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eConstruct compelling data narratives using advanced data visualization techniques (e.g., interactive dashboards in Tableau/Power BI/Looker, custom Python/R visualizations)\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eRequired Qualifications \u0026amp; Skills:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eEducation: Bachelor's / Master's degree in a quantitative field Eg. Data Science, Statistics, Computer Science, Mathematics, Economics, Engineering, or a related discipline.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eExperience: 0-2 years of professional experience for junior analyst role\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eKnowledge or practical exposure to machine learning concepts (e.g., classification, regression, clustering)\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003ePython: Strong proficiency in Python with demonstrable experience using core data science libraries such as Pandas for data manipulation, NumPy for numerical operations, Scikit-learn for basic machine learning concepts, and Matplotlib/Seaborn for data visualization.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eR (Alternative): Alternatively, strong proficiency in R with libraries like dplyr, ggplot2, tidyr, and data.table.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eSQL Mastery: SQL skills, including the ability to write complex queries involving window functions, CTEs (Common Table Expressions), subqueries, and performance optimization techniques for large datasets.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eCloud Data Platforms: Foundational understanding and hands-on experience with at least one major cloud platform (GCP, AWS, or Azure), specifically relating to data storage (e.g., BigQuery, S3, ADLS) and basic compute services.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eData Visualization Tools: Proven experience in developing interactive dashboards and reports using industry-standard BI tools (e.g., Tableau, Power BI, Looker).\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eStatistical Foundations: Solid understanding of core statistical concepts including descriptive statistics, inferential statistics, hypothesis testing (t-tests, ANOVA), confidence intervals, and basic regression analysis.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eBonus Points (Highly Valued Skills \u0026amp; Experience):\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eMedia \u0026amp; Marketing Knowledge: Familiarity with digital marketing concepts, advertising tech (AdTech), marketing tech (MarTech), campaign data, \u0026amp; audience segmentation.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eUnderstanding of web analytics tools (e.g., Google Analytics, Adobe Analytics).\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eExposure to \"Big Data\" technologies (e.g., Spark, Hadoop, Flink).\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eUnderstanding of data modelling principles (star schema, snowflake schema).\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003ePrevious experience or strong interest in the media, advertising, or AdTech/MarTech industries, including knowledge of media data sources (e.g., ad server logs, DSP/SSP data, campaign metrics, web analytics data).\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eBasic understanding of machine learning operations (MLOps) concepts.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eExperience with API integration for data collection.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1e:T511,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cstrong style=\"font-family: verdana, geneva, sans-serif; font-size: 16px; white-space-collapse: preserve;\" data-mce-style=\"font-family: verdana, geneva, sans-serif; font-size: 16px; white-space-collapse: preserve;\"\u003eChoreograph India\u003c/strong\u003e\u003cspan style=\"font-family: verdana, geneva, sans-serif; font-size: 16px; white-space-collapse: preserve; background-color: #ffffff;\" data-mce-style=\"font-family: verdana, geneva, sans-serif; font-size: 16px; white-space-collapse: preserve; background-color: #ffffff;\"\u003e: The Architects of Intelligent Marketing At WPP, we are the world's largest advertising and marketing services company. At the forefront of data-driven innovation within WPP is Choreograph, a global data products and technology company. We empower the world's leading brands by translating complex data into powerful insights and actionable strategies, driving smarter business and marketing outcomes. Choreograph India is a dynamic hub of innovation, where we are actively engaged in cutting-edge projects in Machine Learning, Advanced Analytics, and Artificial Intelligence. We are not just analyzing data; we are building the future of marketing intelligence, solving intricate business challenges, and redefining how brands connect with consumers across diverse markets.\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1f:T15c9,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eAbout the Role: What Does This Role Require?\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003eAs a Data Science \u0026amp; Analytics Specialist, you will be an integral part of our India team, contributing directly to projects that shape marketing strategies for global and local clients. This position is designed for an ambitious and analytical individual eager to launch their career in data science within the exciting realm of media and advertising. This role requires a keen eye for detail, a passion for problem-solving, and a foundational understanding of data science principles. You will be instrumental in turning raw data into meaningful stories, supporting the development of advanced analytical solutions, and ensuring our insights are robust and impactful.\u003c/p\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eKey Responsibilities:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eAdvanced Analytics \u0026amp; Causal Inference:\u003c/li\u003e\u003cli\u003eDesign, execute, and interpret complex statistical analyses (e.g., multivariate regression, time series decomposition, propensity score matching, difference-in-differences) to measure the causal impact of media investments and identify key performance drivers.\u003c/li\u003e\u003cli\u003eDevelop and validate econometric models (e.g., Marketing Mix Models) to quantify cross-channel media effectiveness and optimize budget allocation.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eData Modelling \u0026amp; Feature Engineering:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eCollaborate with Data Scientists to define, refine, and engineer features from raw data for machine learning models, ensuring statistical rigor and business relevance.\u003c/li\u003e\u003cli\u003eConduct in-depth data profiling and validation, working with Data Engineering teams to ensure data fitness for advanced analytical and modeling purposes.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eMethodology \u0026amp; Tooling Development:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eResearch, evaluate, and implement cutting-edge analytical methodologies and statistical frameworks to enhance existing approaches and address new business challenges.\u003c/li\u003e\u003cli\u003eDevelop and maintain reusable analytical codebases (primarily in Python or R) adhering to software engineering best practices, including version control (Git) and modular design.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eTechnical Communication \u0026amp; Strategic Storytelling:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eTranslate complex analytical findings, model outputs, and statistical inferences into clear, actionable recommendations for both technical and executive-level audiences.\u003c/li\u003e\u003cli\u003eConstruct compelling data narratives using advanced data visualization techniques (e.g., interactive dashboards in Tableau/Power BI/Looker, custom Python/R visualizations)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eRequired Qualifications \u0026amp; Skills:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eEducation: Bachelor's / Master's degree in a quantitative field Eg. Data Science, Statistics, Computer Science, Mathematics, Economics, Engineering, or a related discipline.\u003c/li\u003e\u003cli\u003eExperience: 3-6 years of professional experience for experienced executive role in a data analysis or data science-related role.\u003c/li\u003e\u003cli\u003eKnowledge or practical exposure to machine learning concepts (e.g., classification, regression, clustering)\u003c/li\u003e\u003cli\u003ePython: Strong proficiency in Python with demonstrable experience using core data science libraries such as Pandas for data manipulation, NumPy for numerical operations, Scikit-learn for basic machine learning concepts, and Matplotlib/Seaborn for data visualization.\u003c/li\u003e\u003cli\u003eR (Alternative): Alternatively, strong proficiency in R with libraries like dplyr, ggplot2, tidyr, and data.table.\u003c/li\u003e\u003cli\u003eSQL Mastery: SQL skills, including the ability to write complex queries involving window functions, CTEs (Common Table Expressions), subqueries, and performance optimization techniques for large datasets.\u003c/li\u003e\u003cli\u003eCloud Data Platforms: Foundational understanding and hands-on experience with at least one major cloud platform (GCP, AWS, or Azure), specifically relating to data storage (e.g., BigQuery, S3, ADLS) and basic compute services.\u003c/li\u003e\u003cli\u003eData Visualization Tools: Proven experience in developing interactive dashboards and reports using industry-standard BI tools (e.g., Tableau, Power BI, Looker).\u003c/li\u003e\u003cli\u003eStatistical Foundations: Solid understanding of core statistical concepts including descriptive statistics, inferential statistics, hypothesis testing (t-tests, ANOVA), confidence intervals, and basic regression analysis.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eBonus Points (Highly Valued Skills \u0026amp; Experience):\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eMedia \u0026amp; Marketing Knowledge: Familiarity with digital marketing concepts, advertising tech (AdTech), marketing tech (MarTech), campaign data, \u0026amp; audience segmentation.\u003c/li\u003e\u003cli\u003eUnderstanding of web analytics tools (e.g., Google Analytics, Adobe Analytics).\u003c/li\u003e\u003cli\u003eExposure to \"Big Data\" technologies (e.g., Spark, Hadoop, Flink).\u003c/li\u003e\u003cli\u003eUnderstanding of data modelling principles (star schema, snowflake schema).\u003c/li\u003e\u003cli\u003ePrevious experience or strong interest in the media, advertising, or AdTech/MarTech industries, including knowledge of media data sources (e.g., ad server logs, DSP/SSP data, campaign metrics, web analytics data).\u003c/li\u003e\u003cli\u003eBasic understanding of machine learning operations (MLOps) concepts.\u003c/li\u003e\u003cli\u003eExperience with API integration for data collection.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"20:T8c2,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"color: rgb(0, 0, 0); font-family: verdana, geneva, sans-serif; font-size: 12pt; white-space-collapse: preserve; background-color: rgb(255, 255, 255);\" data-mce-style=\"color: #000000; font-family: verdana, geneva, sans-serif; font-size: 12pt; white-space-collapse: preserve; background-color: #ffffff;\"\u003eVAICS is a leading force in data science \u0026amp; technology industry, driving transformation and innovation by offering an extensive suite of services to broad spectrum of industries. Our service portfolio includes:\n \nLife Sciences: We provide a wide range of services in Biostatistics, Statistical Programming, Clinical Data Management, Medical Writing, an ext into mathematical representations.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eStep 3: Starting with random noise\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eMost modern image generation models begin with random pixels that look like static noise.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eStep 4: Denoising the image\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThe AI gradually removes noise step by step while predicting what the final image should look like.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eStep 5: Predicting visual details\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThe model determines where shadows, reflections, textures, edges, and objects should appear based on learned patterns.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eStep 6: Refining the output\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThe image is improved through multiple iterations to enhance realism, depth, lighting, and fine details.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eInteresting fact:\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eAI image generation works more like \u003c/span\u003e\u003cb\u003e\u003cstrong\u003eprobability based imagination\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e than traditional digital drawing.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThat is how tools like ChatGPT, DALL·E, and Midjourney generate visuals that never existed before.\u00
